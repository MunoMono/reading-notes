# North star constants for the thesis + note-taking system.
# Keep this file short. Update here, not inside templates.

research_question:
  # Primary question
  verbatim: "How might testamentary traces of contested design knowledge be mobilised to activate the RCA’s DDR archive?"
  working: "How might testamentary traces of contested design knowledge be mobilised to activate the RCA’s DDR archive?"
  # Secondary question
  secondary: "To what extent ought the ideas that were current at the time to be revisited, and what can the lessons of that period tell us about how we should be thinking about design and design research today?"
  # One-line purpose (keeps notes honest)
  purpose: "Use the DDR archive to identify, interpret, and reactivate testamentary traces of contested design knowledge, and to test what from that period should be revisited for design and design research today."

# Short rules card injected into every note (keeps it simple)
constraints_summary:
  - "No page cite → write TODO (needs page / verification)"
  - "Substantive source → at least 6 critical claims; major canonical source → normally 6–8 or more where warranted"
  - "Critical claims are analytical paragraphs: Claim → Evidence → Warrant → Boundary → Consequence"
  - "Keep author claim, evidence-supported claim, and researcher inference distinct"
  - "Each claim must include a practice cross-check (or TODO)"
  - "End each substantive note with a cross-source / cross-lens synthesis paragraph (or TODO)"
  - "Every source gets one primary theoretical-framework area + one Zotero literature cluster"
  - "No antithesis lists: write Boundary + Risk"
  - "If it doesn’t serve the RQ/theoretical framework: OUT OF SCOPE (why)"

critical_reading_protocol:
  claim_count:
    substantive_minimum: 6
    major_canonical_norm: "6–8, with more where genuinely warranted"
    anti_padding: "Do not manufacture or split claims to meet a quota; if six distinct claims are not supportable, state INSUFFICIENT DISTINCT EVIDENCE FOR 6 CLAIMS."
  paragraph_structure:
    - "Claim"
    - "Evidence (page)"
    - "Warrant"
    - "Boundary"
    - "Consequence"
  voice_separation:
    - "Author claim"
    - "Evidence-supported claim"
    - "Researcher inference"
  synthesis: "Conclude with what the source changes, where it sits in the primary lens, how it connects to other literature, and what still must be demonstrated against DDR evidence."

model:
  title: "Mobilising contested design knowledge in the DDR archive"

  # Primary theoretical-framework filing areas.
  # These mirror the top-level Zotero folders under "Theoretical framework".
  theoretical_framework_areas:
    - id: "1"
      label: "Critical design historiography"
    - id: "2"
      label: "Critical archival theory"
    - id: "3"
      label: "Critical computational approaches"
    - id: "4"
      label: "Feminist + situated knowledge"

project_definitions:
  # Keep these as working definitions — they can tighten later.

  contested_design_knowledge:
    working: "Disputed, unstable, or competing understandings of what design is, how it should proceed, and what counts as valid design knowledge, evidence, or method."
    observable_signs:
      - "Competing definitions of design research"
      - "Disagreement over method, evidence, or legitimacy"
      - "Institutional tensions over what design knowledge is for"
      - "Retrospective re-framings of earlier design positions"

  testamentary_trace:
    working: "A textual, material, institutional, descriptive, or remembered trace that can be treated as evidence of contested design knowledge."
    observable_signs:
      - "Published papers, reports, and internal documents"
      - "Archival descriptions, metadata, and catalogue structures"
      - "Oral histories and retrospective testimony"
      - "Computationally generated representations, retrieval paths, or visualisations"
    caution: "A trace is not neutral; it is shaped by conditions of production, organisation, survival, and interpretation."

  activate_archive:
    working: "Make the DDR archive usable for inquiry: legible, navigable, interpretable, contestable, and generative for new research and practice."
    caution: "Activation is not neutral recovery; it includes mediation, framing, and methodological accountability."

  revisit_current_ideas:
    working: "To assess which ideas from the DDR period remain useful, require revision, or should be challenged in relation to design and design research today."
    observable_signs:
      - "Concepts or methods that still structure present debates"
      - "Ideas that were dropped but may still be generative"
      - "Historical lessons that clarify current assumptions"
      - "Points where the period exposes limits in contemporary design research discourse"

# For the current reading programme, all ingested papers belong to this project tag.
project_tags:
  - "Theoretical framework"

# These mirror the three active Zotero subfolders under each theoretical-framework area.
# Zotero placeholders "d) Z" and "e) ADD" are intentionally excluded.
literature_clusters:
  - id: "a"
    label: "Canon + intellectual lineage"
  - id: "b"
    label: "Operational literature"
  - id: "c"
    label: "Contemporary bridge literature"

zotero_filing:
  root: "Theoretical framework"
  path_pattern: "Theoretical framework / {primary_area} / {literature_cluster}"

always_include_in_notes:
  - "Selected primary theoretical-framework area: 1. Critical design historiography / 2. Critical archival theory / 3. Critical computational approaches / 4. Feminist + situated knowledge"
  - "Selected literature cluster: a) Canon + intellectual lineage / b) Operational literature / c) Contemporary bridge literature"
  - "Zotero filing path: Theoretical framework / [primary area] / [literature cluster]"
  - "How the source moves the primary research question forward (one sentence)"
  - "How the source bears on the secondary question, if relevant"
  - "At least one link to archive material, oral history, practice evidence, or computational method (or TODO)"
  - "Final synthesis paragraph: what this source changes, how it connects to other literature, and what remains to be tested against DDR evidence"
