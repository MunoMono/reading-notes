name: Zotero theoretical framework audit

on:
  workflow_dispatch:
  push:
    branches:
      - zotero-theoretical-framework-audit
    paths:
      - '.github/workflows/zotero-theoretical-framework-audit.yml'
      - 'scripts/zotero_tf_audit.py'
      - 'project/**'
      - 'public/docs/**/*.md'

permissions:
  contents: write

concurrency:
  group: zotero-theoretical-framework-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run read-only Zotero audit
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ROOT_COLLECTION: 'Theoretical framework'
        run: python3 scripts/zotero_tf_audit.py

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: year2-theoretical-framework-audit
          path: |
            data/zotero-theoretical-framework.json
            audits/year2-theoretical-framework-audit.json
            audits/year2-theoretical-framework-audit.md

      - name: Commit refreshed manifest and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/zotero-theoretical-framework.json \
                  audits/year2-theoretical-framework-audit.json \
                  audits/year2-theoretical-framework-audit.md
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
          else
            git commit -m 'chore: refresh Zotero theoretical framework audit'
            git push
          fi

  source_uat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Buckley PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: 'ZV4YNL9B'
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload Buckley source artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-buckley-source
          path: tmp/zotero-source
          retention-days: 1


  source_batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: '37YPQUR4'
            slug: 'walker-1990'
          - key: '4JL7AV7X'
            slug: 'forty-1992'
          - key: 'I5XMMGC6'
            slug: 'boyd-davis-2017'
          - key: 'GD3BNFG9'
            slug: 'cross-1993'
          - key: 'BK782W4J'
            slug: 'archer-1981'
          - key: 'TUPSEC5B'
            slug: 'jones-1992'
          - key: 'XT6KLJDV'
            slug: 'cross-1982'
          - key: 'N445PKKQ'
            slug: 'archer-1963'
          - key: 'DN5Y9JX8'
            slug: 'archer-1979'
          - key: '7PBRRTNA'
            slug: 'boyd-davis-2024'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: ${{ matrix.key }}
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-source-${{ matrix.slug }}
          path: tmp/zotero-source
          retention-days: 1
