name: Fetch computational approaches Zotero PDFs

on:
  push:
    branches:
      - zotero-theoretical-framework-audit
    paths:
      - '.github/workflows/zotero-computational-approaches-sources.yml'

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: 'S8RBKWVC', slug: 'davis-2021-linked-data' }
          - { key: 'XGW459UJ', slug: 'bernard-2025-fairness-ir' }
          - { key: 'Z9IN3FCV', slug: 'radharapu-2025-ambivalence' }
          - { key: 'JFAP2JSU', slug: 'colavizza-2022-archives-ai' }
          - { key: '5C923R7Y', slug: 'zaagsma-2023-politics-digitization' }
          - { key: 'ZJVVPAYV', slug: 'selyshcheva-2026-generative-ai-source' }
          - { key: 'QW5HNSPT', slug: 'hedges-2022-cas-intro' }
          - { key: 'QI2I6HJQ', slug: 'bender-2021-stochastic-parrots' }
          - { key: 'CVVHJD52', slug: 'asai-2026-rai-synthesis' }
          - { key: 'PUUPT229', slug: 'nieto-mcavoy-2024-synthetic-heritage' }
          - { key: 'LUVAUXT2', slug: 'marciano-2022-cas-discipline' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: ${{ matrix.key }}
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload source artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-source-${{ matrix.slug }}
          path: tmp/zotero-source
          retention-days: 1
