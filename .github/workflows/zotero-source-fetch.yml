name: Fetch Zotero source PDF

on:
  push:
    branches:
      - zotero-theoretical-framework-audit
    paths:
      - '.github/workflows/zotero-source-fetch.yml'
      - 'scripts/zotero_fetch_pdf.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Buckley PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: 'ZV4YNL9B'
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-buckley-source
          path: tmp/zotero-source
          retention-days: 1
