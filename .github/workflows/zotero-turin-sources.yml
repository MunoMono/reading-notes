name: Fetch Turin conference Zotero PDFs

on:
  push:
    branches:
      - zotero-theoretical-framework-audit
    paths:
      - '.github/workflows/zotero-turin-sources.yml'

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: 'CMIM3HAW', slug: 'galindo-duran-2026' }
          - { key: 'TU5SUA8E', slug: 'arzomand-2026-harf' }
          - { key: '5VWYHG4S', slug: 'isch-2026' }
          - { key: 'SHSGT8G9', slug: 'deyoung-2024' }
          - { key: 'WNZKFRMU', slug: 'jaillant-2025-navigating-ai' }
          - { key: '6WYW49HX', slug: 'jaillant-2025-tna-uk' }
          - { key: 'Y855GGLW', slug: 'zhu-2025-argrag' }
          - { key: 'BRLTPXXT', slug: 'wang-2025-ragplus' }
          - { key: 'TMQGA95Q', slug: 'xu-2025-uncertainty' }
          - { key: 'M8VSY2TX', slug: 'pan-2007-google-trust' }
          - { key: '8E7X95ID', slug: 'qian-2024-human-ai' }
          - { key: 'YKTM4IGL', slug: 'boyd-davis-2021-trust' }
          - { key: '6SZQRR2Y', slug: 'yu-2025-rag-evaluation' }
          - { key: 'B4EXS6SV', slug: 'axetorn-2026-trust' }
          - { key: '2NMIIM9E', slug: 'pasch-content-moderation' }
          - { key: 'V9N3GDSQ', slug: 'grimes-2021-mental-models' }
          - { key: 'WIXAF3FN', slug: 'carl-2026-source-attribution' }
          - { key: '75LAP993', slug: 'cho-2026-source-visualization' }
          - { key: 'MRE2QMJ7', slug: 'lajewska-2026-rag-trust' }
          - { key: 'EW4I5WU3', slug: 'boruvkova-2025-reconstruction' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: ${{ matrix.key }}
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload source artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-source-${{ matrix.slug }}
          path: tmp/zotero-source
          retention-days: 1
