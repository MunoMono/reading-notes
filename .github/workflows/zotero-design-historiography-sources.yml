name: Fetch design historiography Zotero PDFs

on:
  push:
    branches:
      - zotero-theoretical-framework-audit
    paths:
      - '.github/workflows/zotero-design-historiography-sources.yml'

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: '37YPQUR4'
            slug: 'walker-1990'
          - key: '4JL7AV7X'
            slug: 'forty-1992'
          - key: 'I5XMMGC6'
            slug: 'boyd-davis-2017'
          - key: 'GD3BNFG9'
            slug: 'cross-1993'
          - key: 'BK782W4J'
            slug: 'archer-1981'
          - key: 'TUPSEC5B'
            slug: 'jones-1992'
          - key: 'XT6KLJDV'
            slug: 'cross-1982'
          - key: 'N445PKKQ'
            slug: 'archer-1963'
          - key: 'DN5Y9JX8'
            slug: 'archer-1979'
          - key: '7PBRRTNA'
            slug: 'boyd-davis-2024'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PDF from Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_ITEM_KEY: ${{ matrix.key }}
        run: python3 scripts/zotero_fetch_pdf.py
      - name: Upload source artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-source-${{ matrix.slug }}
          path: tmp/zotero-source
          retention-days: 1
